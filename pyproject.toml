[project]
name = "GridCellsCond"
version = "1.0.0"
description = "Conductance-based model of grid cells"
readme = "Readme.md"
requires-python = "==3.13.*"
dependencies = [
    "NEURON==9.0.0; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'cygwin'",
    "scipy==1.15.1",
    "numpy==2.2.3",
    "h5py==3.12.1",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "ipykernel==6.29.5",
    "pickleshare==0.7.5",
]
[dependency-groups]
docs = [
    "numpy==2.2.3",
    "sphinx==8.1.3",
    "sphinx-rtd-theme==3.0.2",
    "furo==2024.8.6",
    "sphinx-inline-tabs==2023.4.21",
]
other = [
  "fabric2==3.2.2",
  "PyQt6==6.8.0"
]
